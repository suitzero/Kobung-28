name: Deploy DeepSeek to vast.ai

on:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: "Pre-quantized GGUF repo to serve"
        required: false
        default: apetersson/DeepSeek-V4-Flash-0731-Abliterated-DS4-Quality128
      gpu_name:
        description: "vast.ai gpu_name filter"
        required: false
        default: A100_SXM4
      num_gpus:
        description: "Number of GPUs to rent"
        required: false
        default: "2"
      public_expose:
        description: "Map the API port publicly (still gated by API key)? Leave false for SSH-tunnel-only access."
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: vast-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --user vastai

      # Best-effort persistence of terraform state across runs (needed so a
      # later "destroy" run knows which vast.ai instance to tear down). GitHub
      # evicts cache entries unused for 7+ days — the destroy workflow also
      # accepts a manual instance_id input as a fallback if this cache is gone.
      - uses: actions/cache/restore@v4
        with:
          path: |
            terraform/terraform.tfstate
            terraform/.vast_instance_id
          key: vast-tfstate-${{ github.run_id }}
          restore-keys: |
            vast-tfstate-

      - name: Require LLAMA_API_KEY secret
        # This repo is public, which means Actions run logs AND job summaries
        # are publicly viewable by anyone (same as any other public-repo
        # content) — so a key generated here and printed anywhere in this
        # run would be posted to the open internet alongside a live,
        # uncensored model endpoint. So: require it as a secret you set
        # yourself out-of-band, never generate or print one here.
        env:
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
        run: |
          if [ -z "$LLAMA_API_KEY" ]; then
            echo "::error::LLAMA_API_KEY repo secret is not set. This repo is public, so a key generated and printed by this workflow would be publicly visible. Generate one yourself (e.g. 'openssl rand -hex 32') and add it as a repository secret (Settings -> Secrets and variables -> Actions), then re-run."
            exit 1
          fi

      - name: terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: terraform apply
        working-directory: terraform
        env:
          # Both forms needed: TF_VAR_* is how terraform resolves var.vast_api_key
          # (used by the create provisioner), while the plain VAST_API_KEY is
          # what the destroy-time provisioner and data.external.vast_status
          # inherit directly from terraform's own process environment — they
          # deliberately don't get it via a var/trigger (see main.tf comments).
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          TF_VAR_vast_api_key: ${{ secrets.VAST_API_KEY }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}
          TF_VAR_api_key: ${{ secrets.LLAMA_API_KEY }}
          TF_VAR_hf_repo: ${{ inputs.hf_repo }}
          TF_VAR_gpu_name: ${{ inputs.gpu_name }}
          TF_VAR_num_gpus: ${{ inputs.num_gpus }}
          TF_VAR_public_expose: ${{ inputs.public_expose }}
        run: terraform apply -auto-approve

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            terraform/terraform.tfstate
            terraform/.vast_instance_id
          key: vast-tfstate-${{ github.run_id }}

      - name: Publish endpoint info for the web console
        working-directory: terraform
        env:
          PUBLIC_EXPOSE_VAL: ${{ inputs.public_expose }}
        run: |
          STATUS=$(terraform output -raw instance_status 2>/dev/null || echo "unknown")
          HOST=""
          PORT=""
          if [ "$PUBLIC_EXPOSE_VAL" = "true" ]; then
            HOST=$(terraform output -raw public_ip 2>/dev/null || echo "")
            PORT=$(terraform output -raw public_port 2>/dev/null || echo "")
          fi
          cat > ../docs/endpoint.json <<JSON
          {
            "status": "$STATUS",
            "public_expose": $PUBLIC_EXPOSE_VAL,
            "host": "$HOST",
            "port": "$PORT",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      - name: Commit endpoint info
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/endpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Update web console endpoint info [skip ci]"
            git push
          else
            echo "docs/endpoint.json unchanged"
          fi

      - name: Summarize
        working-directory: terraform
        run: |
          {
            echo "## vast.ai deploy"
            echo
            echo '```'
            terraform output
            echo '```'
            echo
            echo "Save the instance id from \`terraform/.vast_instance_id\` (also cached) — pass it to the destroy workflow's \`instance_id\` input if the cache ever goes missing."
            echo
            echo "Web console: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ (needs GitHub Pages enabled once — Settings → Pages → Deploy from a branch → this branch → /docs). This repo is public, so paste your LLAMA_API_KEY into the console yourself (it's saved in that browser's local storage) — it is never written anywhere in this repo or in these Actions logs."
          } >> "$GITHUB_STEP_SUMMARY"
