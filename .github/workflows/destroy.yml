name: Destroy vast.ai instance

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "vast.ai instance id to destroy directly, bypassing terraform state. Leave blank to destroy via the cached terraform state from the last deploy run."
        required: false
        default: ""

concurrency:
  group: vast-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --user vastai

      - name: Destroy by instance id (bypasses terraform)
        if: inputs.instance_id != ''
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          vastai destroy instance "${{ inputs.instance_id }}"

      - uses: hashicorp/setup-terraform@v3
        if: inputs.instance_id == ''
        with:
          terraform_version: "1.9"

      - uses: actions/cache/restore@v4
        if: inputs.instance_id == ''
        with:
          path: |
            terraform/terraform.tfstate
            terraform/.vast_instance_id
          key: vast-tfstate-${{ github.run_id }}
          restore-keys: |
            vast-tfstate-

      - name: terraform destroy
        if: inputs.instance_id == ''
        working-directory: terraform
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          TF_VAR_vast_api_key: ${{ secrets.VAST_API_KEY }}
          TF_VAR_hf_token: ${{ secrets.HF_TOKEN }}
          TF_VAR_api_key: "unused"
        run: |
          if [ ! -f .vast_instance_id ]; then
            echo "::error::No cached terraform state found (cache may have expired). Check https://cloud.vast.ai/instances/ for running instances and re-run this workflow with the instance_id input set."
            exit 1
          fi
          terraform init -input=false
          terraform destroy -auto-approve

      - uses: actions/cache/save@v4
        if: always() && inputs.instance_id == ''
        with:
          path: |
            terraform/terraform.tfstate
            terraform/.vast_instance_id
          key: vast-tfstate-${{ github.run_id }}

      - name: Mark web console endpoint inactive
        if: success()
        run: |
          cat > docs/endpoint.json <<JSON
          {
            "status": "destroyed",
            "public_expose": false,
            "host": "",
            "port": "",
            "updated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/endpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark web console endpoint inactive [skip ci]"
            git push
          else
            echo "docs/endpoint.json unchanged"
          fi
